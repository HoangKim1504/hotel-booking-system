spring.application.name=hotel-booking-system
server.port=8080
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/hotel_booking_db}
#spring.mongodb.uri=mongodb://localhost:27017/hotel_booking_db
spring.mongodb.auto-index-creation=true
spring.jackson.time-zone=Asia/Ho_Chi_Minh
app.jwt.secret=${JWT_SECRET:hotel-booking-system-secret-change-me-32chars-min}
app.jwt.expiration-ms=3600000