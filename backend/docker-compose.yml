services:
  mongo:
    image: mongo:7
    ports:
      # Compass / mongoimport từ máy HV (tuỳ chọn)
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      # Persist khi compose down (xoá volume: compose down -v)
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: ./hotel-booking-system
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Hostname "mongo" = DNS nội bộ Composespring.
      SPRING_MONGODB_URI: mongodb://root:password@mongo:27017/hotel_booking_db?authSource=admin
      JWT_SECRET: hotel-booking-system-secret-change-me-32chars-min
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
